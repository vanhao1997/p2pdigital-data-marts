name: Build and Deploy @owox/docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # can't set --ignore-scripts because Astro uses postinstall
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --loglevel error

      - name: Build
        run: npm run build:docs
        env:
          NODE_ENV: production
          DOCS_SITE: ${{ vars.DOCS_SITE || 'https://docs.p2pdigital.io.vn' }}
          DOCS_BASE: ${{ vars.DOCS_BASE }}
          PUBLIC_GTM_ID: ${{ secrets.DOCS_GTM_ID }}

      - name: Add .nojekyll file
        run: touch apps/docs/dist/.nojekyll

      - name: Add CNAME file
        if: vars.DOCS_PAGES_ENABLED == 'true' && vars.DOCS_CNAME != ''
        env:
          DOCS_CNAME: ${{ vars.DOCS_CNAME }}
        run: printf '%s\n' "$DOCS_CNAME" > apps/docs/dist/CNAME

      - name: Configure GitHub Pages
        if: vars.DOCS_PAGES_ENABLED == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: vars.DOCS_PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/dist

  deploy-pages:
    name: Deploy Pages artifact
    if: vars.DOCS_PAGES_ENABLED == 'true'
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
